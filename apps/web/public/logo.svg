    <filter id="v1a-shadow" x="2" y="2" width="28" height="28" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.35"/>
